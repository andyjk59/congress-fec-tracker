name: Refresh bills

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 9am UTC
  workflow_dispatch: {}

permissions:
  contents: write

# Both workflows rewrite the same binary data/tracker.db, which can't be
# merged -- run them one at a time so each starts from the latest pushed copy.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/refresh_bills.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Publish bills tables
        run: |
          python scripts/publish_db.py --owner bills --message "chore: refresh bills data"
