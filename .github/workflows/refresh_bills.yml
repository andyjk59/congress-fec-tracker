name: Refresh bills

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 9am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/refresh_bills.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/tracker.db
          git diff --cached --quiet || git commit -m "chore: refresh bills data"
          git diff --cached --quiet || git push
