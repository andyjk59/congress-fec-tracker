name: Refresh FEC data

# No schedule: the weekly FEC refresh runs on a local machine instead (see
# scripts/local_fec_refresh.sh), because retention and industry signals need
# the gitignored raw fingerprint cache that a fresh CI runner doesn't have.
# This manual trigger remains for ad-hoc org/PAC-donor ingestion.
on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Committee/cycle pairs to ingest this run (raise for manual backfill runs)"
        default: "50"

permissions:
  contents: write

# Both workflows rewrite the same binary data/tracker.db, which can't be
# merged -- run them one at a time so each starts from the latest pushed copy.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache/fec_raw.db
          key: fec-raw-v1
          restore-keys: fec-raw-

      - run: python scripts/refresh_fec.py --chunk-size ${{ github.event.inputs.chunk_size || '50' }}
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Publish fec tables
        run: |
          python scripts/publish_db.py --owner fec --message "chore: refresh FEC data"
