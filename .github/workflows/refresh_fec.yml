name: Refresh FEC data

on:
  schedule:
    - cron: "30 9 * * 1"   # weekly, Monday 9:30am UTC
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Committee/cycle pairs to ingest this run (raise for manual backfill runs)"
        default: "50"

permissions:
  contents: write

# Both workflows rewrite the same binary data/tracker.db, which can't be
# merged -- run them one at a time so each starts from the latest pushed copy.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache/fec_raw.db
          key: fec-raw-v1
          restore-keys: fec-raw-

      - run: python scripts/refresh_fec.py --chunk-size ${{ github.event.inputs.chunk_size || '50' }}
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Commit and push data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/tracker.db
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh FEC data"
            git push
          fi
